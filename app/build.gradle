plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
// Optional pre-filled address for your own builds (never committed): hermes.url in local.properties or -Phermes.url=...
// Public builds leave it empty and ask on first launch.
def hermesUrl = (project.findProperty('hermes.url') ?: localProps.getProperty('hermes.url') ?: '')
// Release signing comes from the environment only, so no key material lives in the repo.
def releaseStore = System.getenv('HR_KEYSTORE')

android {
    namespace 'com.hermes.webui'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "io.github.yuttan.hermesremote"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.2.0"
        buildConfigField "String", "DEFAULT_URL", "\"${hermesUrl}\""
    }

    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('HR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HR_KEY_ALIAS')
                keyPassword System.getenv('HR_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
